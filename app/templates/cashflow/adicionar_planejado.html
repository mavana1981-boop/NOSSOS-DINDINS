{% extends "base.html" %}
{% block title %}Adicionar Parcela Projetada{% endblock %}
{% block content %}

<div class="page-header">
  <div class="page-title-wrap">
    <h1>➕ Adicionar Parcela Projetada</h1>
    <p>Use para regularizar séries com meses faltando ou incorretos.</p>
  </div>
  <a href="{{ url_for('cashflow.planejados') }}" class="btn btn-ghost">← Parcelados</a>
</div>

<div class="card" style="max-width:560px;">
  <form method="POST" action="{{ url_for('cashflow.adicionar_planejado') }}">

    <div class="form-group mb-3">
      <label class="form-label">Descrição <span style="color:var(--red);">*</span></label>
      <input type="text" name="description" class="form-control"
             value="{{ desc_default }}" placeholder="Ex: TOTUS ASA NORTE" required>
      <div class="text-faint text-small mt-1">Use a mesma descrição das outras parcelas da série.</div>
    </div>

    <div class="grid grid-2 mb-3" style="gap:12px;">
      <div class="form-group mb-0">
        <label class="form-label">Valor (R$) <span style="color:var(--red);">*</span></label>
        <input type="text" name="amount" class="form-control mono"
               placeholder="0,00" required>
      </div>
      <div class="form-group mb-0">
        <label class="form-label">Mês (billing) <span style="color:var(--red);">*</span></label>
        <input type="month" name="billing_month" class="form-control"
               value="{{ mes_default }}" required>
      </div>
    </div>

    <div class="grid grid-2 mb-3" style="gap:12px;">
      <div class="form-group mb-0">
        <label class="form-label">Nº da parcela</label>
        <input type="number" name="installment_no" class="form-control"
               value="{{ inst_default or 1 }}" min="1" required>
      </div>
      <div class="form-group mb-0">
        <label class="form-label">Total de parcelas</label>
        <input type="number" name="installments" class="form-control"
               value="{{ total_default or 1 }}" min="1" required>
      </div>
    </div>

    <div class="form-group mb-3">
      <label class="form-label">Cartão (opcional)</label>
      <select name="card_id" class="form-control">
        <option value="">— Nenhum —</option>
        {% for card in cards %}
        <option value="{{ card.id }}">
          {{ card.name }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="flex flex-gap" style="gap:8px;justify-content:flex-end;">
      <a href="{{ url_for('cashflow.planejados') }}" class="btn btn-ghost">Cancelar</a>
      <button type="submit" class="btn btn-primary">➕ Adicionar parcela</button>
    </div>
  </form>
</div>
{% endblock %}
